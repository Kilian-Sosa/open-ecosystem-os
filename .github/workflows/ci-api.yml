name: API CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  api:
    name: Compile and test API
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-maven-ci.yml
    with:
      job-name: Compile and test API
      java-version: "25"
      working-directory: apps/api
      test-step-name: Unit and slice tests
      report-artifact-name: api-test-reports
      report-path: |
        apps/api/**/target/surefire-reports/**
        apps/api/**/target/failsafe-reports/**
