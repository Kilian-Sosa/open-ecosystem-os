name: OWASP Dependency Check (Advisory)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  dependency-check-api:
    name: OWASP Dependency-Check API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/api
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x mvnw

      - name: Dependency-Check
        run: ./mvnw -B -DskipTests verify -P security-scan

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-dependency-check-report
          path: apps/api/target/dependency-check-report.*

  dependency-check-worker:
    name: OWASP Dependency-Check Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/worker
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x mvnw

      - name: Dependency-Check
        run: ./mvnw -B -DskipTests verify -P security-scan

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-dependency-check-report
          path: apps/worker/target/dependency-check-report.*
