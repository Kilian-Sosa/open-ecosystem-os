name: Worker CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  worker:
    name: Compile and test worker
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-maven-ci.yml
    with:
      job-name: Compile and test worker
      java-version: "25"
      working-directory: apps/worker
      test-step-name: Unit and worker tests
      report-artifact-name: worker-test-reports
      report-path: |
        apps/worker/**/target/surefire-reports/**
        apps/worker/**/target/failsafe-reports/**
