name: E2E Compose Smoke

# Deferred template: do not copy into .github/workflows/ until apps/web has
# Playwright configuration, installed Playwright dependencies, and @smoke tests.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e-compose.yml'

permissions:
  contents: read

jobs:
  e2e:
    name: Docker Compose + Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -f infra/docker/docker-compose.yml up -d --build

      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/docker/docker-compose.yml logs
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Playwright dependencies
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps

      - name: Run E2E smoke tests
        working-directory: apps/web
        run: pnpm playwright test --grep @smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs

      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
