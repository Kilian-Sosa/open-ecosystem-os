name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: "25"
  MAVEN_VERSION: "3.9.15"

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  dependency-check-api:
    name: OWASP Dependency-Check API
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/api/pom.xml') != '' }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install Maven
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSLO "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz.sha512"
          echo "$(cat "apache-maven-${MAVEN_VERSION}-bin.tar.gz.sha512")  apache-maven-${MAVEN_VERSION}-bin.tar.gz" | sha512sum -c -
          tar -xzf "apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          java -version
          mvn -version

      - name: Prepare Maven wrapper shim
        run: chmod +x mvnw

      - name: Dependency-Check
        run: ./mvnw -B org.owasp:dependency-check-maven:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: apps/api/target/dependency-check-report.*
