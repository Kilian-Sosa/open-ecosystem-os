name: Web CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/shared/**'
      - 'DESIGN.md'
      - 'AGENTS.md'
      - 'docs/development/**'
      - '.github/workflows/ci-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/shared/**'
      - 'DESIGN.md'
      - 'AGENTS.md'
      - 'docs/development/**'
      - '.github/workflows/ci-web.yml'

permissions:
  contents: read

jobs:
  web:
    name: Format, lint, test, build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit/component tests
        run: pnpm test

      - name: Build
        run: pnpm build
