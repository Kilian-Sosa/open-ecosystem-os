name: Docs Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '.github/workflows/docs-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '.github/workflows/docs-quality.yml'

permissions:
  contents: read

jobs:
  docs-format:
    name: Markdown/YAML/JSON format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prettier check
        run: npx prettier "**/*.{md,json,yaml,yml}" --check
