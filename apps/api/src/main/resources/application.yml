spring:
  application:
    name: open-ecosystem-api
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:openecosystem}
    password: ${RABBITMQ_PASSWORD:openecosystem_dev_password}
    listener:
      simple:
        default-requeue-rejected: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openecosystem}
    username: ${SPRING_DATASOURCE_USERNAME:openecosystem}
    password: ${SPRING_DATASOURCE_PASSWORD:openecosystem_dev_password}
  servlet:
    multipart:
      max-file-size: ${DRIVE_MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${DRIVE_MAX_REQUEST_SIZE:25MB}

server:
  port: ${API_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name:-open-ecosystem-api} correlationId=%X{correlationId:-none} [%thread] %logger{36} - %msg%n"

openecosystem:
  cors:
    allowed-origins: ${APP_BASE_URL:http://localhost:3000},http://127.0.0.1:3000
  drive:
    max-upload-size: ${DRIVE_MAX_UPLOAD_SIZE:25MB}
    encryption:
      key-id: ${DRIVE_ENCRYPTION_KEY_ID:dev-local}
      key-base64: ${DRIVE_ENCRYPTION_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - text/plain
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
  events:
    exchange: ${EVENTS_EXCHANGE:openecosystem.events}
    retry-exchange: ${EVENTS_RETRY_EXCHANGE:openecosystem.events.retry}
    dead-letter-exchange: ${EVENTS_DEAD_LETTER_EXCHANGE:openecosystem.events.dlx}
    outbox:
      enabled: ${EVENT_OUTBOX_PUBLISHER_ENABLED:true}
      poll-interval-ms: ${EVENT_OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${EVENT_OUTBOX_BATCH_SIZE:50}
    queues:
      retry-delay: ${OCR_RETRY_DELAY_SECONDS:30s}
  media:
    ocr:
      max-attempts: ${OCR_MAX_ATTEMPTS:3}
      retry-delay: ${OCR_RETRY_DELAY_SECONDS:30s}
  search:
    meilisearch-host: ${MEILISEARCH_HOST:http://localhost:7700}
    meilisearch-master-key: ${MEILISEARCH_MASTER_KEY:openecosystem_dev_master_key}
    index-name: ${MEILISEARCH_INDEX_NAME:openecosystem_documents}
    max-attempts: ${SEARCH_INDEX_MAX_ATTEMPTS:3}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:local}
      bucket: ${S3_BUCKET:openecosystem}
      access-key: ${S3_ACCESS_KEY:openecosystem}
      secret-key: ${S3_SECRET_KEY:openecosystem_dev_password}
      path-style-access-enabled: ${S3_PATH_STYLE_ACCESS:true}
