apiVersion: v1
kind: ConfigMap
metadata:
  name: open-ecosystem-config
  namespace: open-ecosystem-os
data:
  APP_ENV: "kubernetes"
  API_BASE_URL: "http://open-ecosystem-api:8080"
  S3_ENDPOINT: "http://minio.open-ecosystem-data:9000"
  S3_REGION: "local"
  S3_BUCKET: "openecosystem"
  S3_PATH_STYLE_ACCESS: "true"
  DRIVE_MAX_UPLOAD_SIZE: "25MB"
  DRIVE_MAX_REQUEST_SIZE: "25MB"
  MEILISEARCH_HOST: "http://meilisearch.open-ecosystem-data:7700"
