apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-ecosystem-api
  namespace: open-ecosystem-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-ecosystem-api
  template:
    metadata:
      labels:
        app: open-ecosystem-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/open-ecosystem-api:dev
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: open-ecosystem-config
            - secretRef:
                name: open-ecosystem-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: open-ecosystem-api
  namespace: open-ecosystem-os
spec:
  selector:
    app: open-ecosystem-api
  ports:
    - port: 8080
      targetPort: 8080
