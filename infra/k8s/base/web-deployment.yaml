apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-ecosystem-web
  namespace: open-ecosystem-os
  labels:
    app.kubernetes.io/name: open-ecosystem-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: open-ecosystem-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-ecosystem-web
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app: open-ecosystem-web
        app.kubernetes.io/name: open-ecosystem-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: open-ecosystem-os
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/your-org/open-ecosystem-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: open-ecosystem-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: open-ecosystem-web
  namespace: open-ecosystem-os
  labels:
    app.kubernetes.io/name: open-ecosystem-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: open-ecosystem-os
spec:
  selector:
    app.kubernetes.io/name: open-ecosystem-web
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
