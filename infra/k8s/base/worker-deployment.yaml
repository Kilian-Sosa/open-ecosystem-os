apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-ecosystem-worker
  namespace: open-ecosystem-os
  labels:
    app.kubernetes.io/name: open-ecosystem-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: open-ecosystem-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-ecosystem-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app: open-ecosystem-worker
        app.kubernetes.io/name: open-ecosystem-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: open-ecosystem-os
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/your-org/open-ecosystem-worker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: open-ecosystem-config
            - secretRef:
                name: open-ecosystem-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-ecosystem-worker
  namespace: open-ecosystem-os
  labels:
    app.kubernetes.io/name: open-ecosystem-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: open-ecosystem-os
spec:
  selector:
    app.kubernetes.io/name: open-ecosystem-worker
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: 8081
      targetPort: http
