apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-ecosystem-ingress
  namespace: open-ecosystem-os
  labels:
    app.kubernetes.io/name: open-ecosystem-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: open-ecosystem-os
spec:
  rules:
    - host: open-ecosystem.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-ecosystem-web
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: open-ecosystem-api
                port:
                  name: http
