apiVersion: v1
kind: Secret
metadata:
  name: open-ecosystem-secrets
  namespace: open-ecosystem-os
  labels:
    app.kubernetes.io/name: open-ecosystem-secrets
    app.kubernetes.io/part-of: open-ecosystem-os
  annotations:
    openecosystem.dev/secret-scope: "local-fake-values-only"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://openecosystem:openecosystem_dev_password@postgres.open-ecosystem-data.svc.cluster.local:5432/openecosystem"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.open-ecosystem-data.svc.cluster.local:5432/openecosystem"
  SPRING_DATASOURCE_USERNAME: "openecosystem"
  SPRING_DATASOURCE_PASSWORD: "openecosystem_dev_password"
  REDIS_URL: "redis://redis.open-ecosystem-data.svc.cluster.local:6379"
  RABBITMQ_URL: "amqp://openecosystem:openecosystem_dev_password@rabbitmq.open-ecosystem-data.svc.cluster.local:5672"
  RABBITMQ_USERNAME: "openecosystem"
  RABBITMQ_PASSWORD: "openecosystem_dev_password"
  S3_ACCESS_KEY: "openecosystem"
  S3_SECRET_KEY: "openecosystem_dev_password"
  DRIVE_ENCRYPTION_KEY_ID: "dev-local"
  DRIVE_ENCRYPTION_KEY_BASE64: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  MEILISEARCH_MASTER_KEY: "openecosystem_dev_master_key"
  OPENAI_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: open-ecosystem-data-secrets
  namespace: open-ecosystem-data
  labels:
    app.kubernetes.io/name: open-ecosystem-data-secrets
    app.kubernetes.io/part-of: open-ecosystem-os
  annotations:
    openecosystem.dev/secret-scope: "local-fake-values-only"
type: Opaque
stringData:
  POSTGRES_DB: "openecosystem"
  POSTGRES_USER: "openecosystem"
  POSTGRES_PASSWORD: "openecosystem_dev_password"
  RABBITMQ_DEFAULT_USER: "openecosystem"
  RABBITMQ_DEFAULT_PASS: "openecosystem_dev_password"
  MINIO_ROOT_USER: "openecosystem"
  MINIO_ROOT_PASSWORD: "openecosystem_dev_password"
  MEILI_MASTER_KEY: "openecosystem_dev_master_key"
