apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - dev-secrets.yaml
  - data-stack.yaml
  - api-prefix-compat-ingress.yaml

images:
  - name: ghcr.io/your-org/open-ecosystem-web
    newName: open-ecosystem-web
    newTag: dev
  - name: ghcr.io/your-org/open-ecosystem-api
    newName: open-ecosystem-api
    newTag: dev
  - name: ghcr.io/your-org/open-ecosystem-worker
    newName: open-ecosystem-worker
    newTag: dev

patches:
  - path: app-config-patch.yaml
  - path: ingress-patch.yaml
