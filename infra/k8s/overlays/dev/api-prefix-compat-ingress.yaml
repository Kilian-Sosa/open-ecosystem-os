apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-ecosystem-api-prefix-compat-ingress
  namespace: open-ecosystem-os
  labels:
    app.kubernetes.io/name: open-ecosystem-api-prefix-compat-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: open-ecosystem-os
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: open-ecosystem.local
      http:
        paths:
          - path: /api/api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: open-ecosystem-api
                port:
                  name: http
