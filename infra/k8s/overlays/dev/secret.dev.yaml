apiVersion: v1
kind: Secret
metadata:
  name: open-ecosystem-secrets
  namespace: open-ecosystem-os
  annotations:
    open-ecosystem.io/secret-purpose: "local-dev-only"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://openecosystem:openecosystem_dev_password@postgres.open-ecosystem-data:5432/openecosystem"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.open-ecosystem-data:5432/openecosystem"
  SPRING_DATASOURCE_USERNAME: "openecosystem"
  SPRING_DATASOURCE_PASSWORD: "openecosystem_dev_password"
  REDIS_URL: "redis://redis.open-ecosystem-data:6379"
  RABBITMQ_URL: "amqp://openecosystem:openecosystem_dev_password@rabbitmq.open-ecosystem-data:5672"
  RABBITMQ_USERNAME: "openecosystem"
  RABBITMQ_PASSWORD: "openecosystem_dev_password"
  S3_ACCESS_KEY: "openecosystem"
  S3_SECRET_KEY: "openecosystem_dev_password"
  DRIVE_ENCRYPTION_KEY_ID: "local-dev-key"
  DRIVE_ENCRYPTION_KEY_BASE64: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  MEILISEARCH_MASTER_KEY: "openecosystem_dev_master_key"
  OPENAI_API_KEY: ""
