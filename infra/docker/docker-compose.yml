name: ${COMPOSE_PROJECT_NAME:-open-ecosystem-os}

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../../apps/web
          ignore:
            - node_modules/
            - .next/
            - coverage/
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - openecosystem-public
      - openecosystem-internal

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../../apps/api
          ignore:
            - target/
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      API_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgresql://openecosystem:openecosystem_dev_password@postgres:5432/openecosystem}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/openecosystem}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-openecosystem}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-openecosystem_dev_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://openecosystem:openecosystem_dev_password@rabbitmq:5672}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-openecosystem}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-openecosystem_dev_password}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-local}
      S3_BUCKET: ${S3_BUCKET:-openecosystem}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openecosystem}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-openecosystem_dev_password}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      DRIVE_MAX_UPLOAD_SIZE: ${DRIVE_MAX_UPLOAD_SIZE:-25MB}
      DRIVE_MAX_REQUEST_SIZE: ${DRIVE_MAX_REQUEST_SIZE:-25MB}
      DRIVE_ENCRYPTION_KEY_ID: ${DRIVE_ENCRYPTION_KEY_ID:-dev-local}
      DRIVE_ENCRYPTION_KEY_BASE64: ${DRIVE_ENCRYPTION_KEY_BASE64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-http://meilisearch:7700}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-openecosystem_dev_master_key}
      MEILISEARCH_INDEX_NAME: ${MEILISEARCH_INDEX_NAME:-openecosystem_documents}
      SEARCH_INDEX_MAX_ATTEMPTS: ${SEARCH_INDEX_MAX_ATTEMPTS:-3}
      OCR_MAX_ATTEMPTS: ${OCR_MAX_ATTEMPTS:-3}
      OCR_RETRY_DELAY_SECONDS: ${OCR_RETRY_DELAY_SECONDS:-30s}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:8080/health >/dev/null || curl -fsS http://127.0.0.1:8080/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - openecosystem-public
      - openecosystem-internal

  worker:
    build:
      context: ../../apps/worker
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ../../apps/worker
          ignore:
            - target/
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      WORKER_PORT: ${WORKER_PORT:-8081}
      DATABASE_URL: ${DATABASE_URL:-postgresql://openecosystem:openecosystem_dev_password@postgres:5432/openecosystem}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/openecosystem}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-openecosystem}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-openecosystem_dev_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://openecosystem:openecosystem_dev_password@rabbitmq:5672}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-openecosystem}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-openecosystem_dev_password}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-local}
      S3_BUCKET: ${S3_BUCKET:-openecosystem}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openecosystem}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-openecosystem_dev_password}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      DRIVE_ENCRYPTION_KEY_ID: ${DRIVE_ENCRYPTION_KEY_ID:-dev-local}
      DRIVE_ENCRYPTION_KEY_BASE64: ${DRIVE_ENCRYPTION_KEY_BASE64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-http://meilisearch:7700}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-openecosystem_dev_master_key}
      MEILISEARCH_INDEX_NAME: ${MEILISEARCH_INDEX_NAME:-openecosystem_documents}
      SEARCH_INDEX_MAX_ATTEMPTS: ${SEARCH_INDEX_MAX_ATTEMPTS:-3}
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      OCR_MAX_ATTEMPTS: ${OCR_MAX_ATTEMPTS:-3}
      OCR_RETRY_DELAY_SECONDS: ${OCR_RETRY_DELAY_SECONDS:-30s}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:${WORKER_PORT:-8081}/health >/dev/null || curl -fsS http://127.0.0.1:${WORKER_PORT:-8081}/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - openecosystem-public
      - openecosystem-internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openecosystem}
      POSTGRES_USER: ${POSTGRES_USER:-openecosystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openecosystem_dev_password}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---locale=C --auth-host=scram-sha-256 --auth-local=trust}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-openecosystem} -d ${POSTGRES_DB:-openecosystem}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openecosystem-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openecosystem-internal

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: ${RABBITMQ_NODENAME:-rabbit@rabbitmq}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-openecosystem}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-openecosystem_dev_password}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - openecosystem-internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-openecosystem}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-openecosystem_dev_password}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || wget -q -O- http://127.0.0.1:9000/minio/health/live >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - openecosystem-internal

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-openecosystem_dev_master_key}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_LOG_LEVEL: ${MEILI_LOG_LEVEL:-WARN}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:7700/health >/dev/null || wget -q -O- http://127.0.0.1:7700/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - openecosystem-internal

networks:
  openecosystem-public:
    driver: bridge
  openecosystem-internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  meilisearch-data:
