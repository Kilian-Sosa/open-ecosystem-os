groups:
  - name: open-ecosystem-targets
    rules:
      - alert: OpenEcosystemApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Open Ecosystem API target is down
          description: Prometheus has not been able to scrape the API metrics endpoint for 2 minutes.

      - alert: OpenEcosystemWorkerDown
        expr: up{job="worker"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Open Ecosystem worker target is down
          description: Prometheus has not been able to scrape the worker metrics endpoint for 2 minutes.

      - alert: OpenEcosystemHighApi5xxRate
        expr: sum(rate(http_server_requests_seconds_count{job="api", status=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open Ecosystem API 5xx rate is elevated
          description: API 5xx responses have exceeded the MVP warning threshold for 5 minutes.

  - name: open-ecosystem-placeholders
    rules:
      - alert: OpenEcosystemQueueDepthHighPlaceholder
        expr: vector(0) > 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: Queue depth alert placeholder
          description: Replace this rule with RabbitMQ exporter metrics when broker metrics are added.

      - alert: OpenEcosystemDlqGrowingPlaceholder
        expr: vector(0) > 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: DLQ growth alert placeholder
          description: Replace this rule with RabbitMQ DLQ metrics when broker metrics are added.
